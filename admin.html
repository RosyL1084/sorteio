<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel do sorteio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--disp:"Lilita One",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--gold:#e8b13a;--cream:#f7e8b4;--blk:#000;--er:#ff8b7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--cream);font:16px/1.4 var(--disp);
background:radial-gradient(ellipse 60% 38% at 12% 8%,rgba(176,184,196,.34),transparent 70%),radial-gradient(ellipse 55% 34% at 92% 30%,rgba(140,148,160,.24),transparent 70%),radial-gradient(ellipse 65% 40% at 20% 95%,rgba(150,158,170,.26),transparent 70%),radial-gradient(ellipse 50% 30% at 85% 92%,rgba(196,202,212,.30),transparent 70%),#030303;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;opacity:.06;background:repeating-linear-gradient(45deg,var(--gold) 0 2px,transparent 2px 22px);pointer-events:none}
.hide{display:none!important}
#login{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
#panel{position:relative;max-width:560px;margin:0 auto;padding:24px 16px 40px}
.card{position:relative;margin-top:0;margin-bottom:26px;width:100%;max-width:420px;text-align:center;padding:26px 20px 22px;background:linear-gradient(#2b2411 0%,#12100a 30%,#050403 100%);border:3px solid var(--gold);border-radius:22px;box-shadow:inset 0 1px 0 rgba(247,232,180,.35),0 9px 0 #5a4210,0 20px 30px rgba(0,0,0,.7)}
#login .card{margin-bottom:9px}
#panel .card{max-width:none}
.card.plain{padding-top:20px;text-align:left}
.badge{display:inline-block;background:linear-gradient(#2a2210,#000);box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(247,232,180,.3);color:var(--cream);border:2px solid var(--gold);border-radius:12px;padding:2px 14px;font-size:14px;letter-spacing:.06em;transform:rotate(-3deg);margin-bottom:10px}
h1{margin:6px 0 12px;font-size:clamp(28px,8vw,36px);font-weight:400;line-height:1.05;color:var(--cream);text-shadow:0 2px 0 #7a5a14,0 5px 0 var(--blk),0 10px 18px rgba(0,0,0,.6)}
h2{margin:0 0 12px;font-size:20px;font-weight:400;color:var(--cream)}
input{width:100%;padding:14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--gold);background:linear-gradient(#000,#14100a);color:var(--cream);font:inherit;font-size:19px;text-align:center;box-shadow:inset 0 4px 8px rgba(0,0,0,.85),0 1px 0 rgba(247,232,180,.18)}
input::placeholder{color:#7d7048}
input:focus{outline:2px solid var(--cream);outline-offset:2px}
button{width:100%;padding:14px;border:2px solid var(--gold);border-radius:14px;background:linear-gradient(#2b2411 0%,#12100a 48%,#050403 100%);color:var(--cream);font:inherit;font-size:22px;letter-spacing:.05em;cursor:pointer;text-shadow:0 2px 0 #000;box-shadow:inset 0 1px 0 rgba(247,232,180,.35),0 5px 0 #5a4210,0 10px 14px rgba(0,0,0,.6);transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(247,232,180,.35),0 1px 0 #5a4210,0 3px 6px rgba(0,0,0,.6)}
button:disabled{opacity:.5}
button.sec{white-space:nowrap;width:auto;padding:8px 14px;font-size:15px;letter-spacing:.03em;box-shadow:inset 0 1px 0 rgba(247,232,180,.25),0 3px 0 #5a4210}
#err{min-height:22px;margin-top:12px;color:var(--er);font-size:16px}
.name{font-size:clamp(28px,9vw,42px);word-break:break-all;min-height:56px;line-height:1.2;color:var(--cream);text-shadow:0 3px 0 #000}
.name.win{color:var(--gold);text-shadow:0 3px 0 #000,0 0 22px rgba(232,177,58,.55);animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.lbl{color:#a99a68;font-size:16px}
#go{margin-top:12px;font-size:24px}
label.ck{display:flex;gap:8px;align-items:center;justify-content:center;color:#a99a68;font-size:15px;margin-top:20px}
label.ck input{width:auto;margin:0;accent-color:var(--gold);box-shadow:none}
.meta{display:flex;justify-content:space-between;align-items:center;color:#a99a68;font-size:16px;margin-bottom:12px}
.meta b{color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:7px;max-height:200px;overflow-y:auto;padding-bottom:4px}
.chip{background:#000;border:1.5px solid var(--gold);border-radius:99px;padding:3px 12px;font-size:15px;color:var(--cream)}
ol{margin:0;padding-left:24px;color:var(--cream)}li{padding:3px 0}
.st{display:none;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:92%;text-align:center;background:#000;border:2px solid var(--gold);border-radius:14px;padding:10px 18px;font-size:16px;color:var(--cream);box-shadow:0 6px 18px rgba(0,0,0,.7)}
.st.show{display:block}.st.er{border-color:var(--er);color:var(--er)}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.chip{cursor:pointer}
.chip.sel{background:#2b2411;border-color:var(--cream)}
.ed{margin-top:14px;padding-top:14px;border-top:1px solid #3a2f12}
.edrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row{display:flex;gap:8px;align-items:center}.row input{margin:0;text-align:left;flex:1;min-width:0}
.prow{display:flex;gap:8px;align-items:center;margin-top:10px}
.prow input{margin:0;text-align:left;padding:10px 12px;font-size:17px;flex:1;min-width:0}
.prow button.sec{padding:8px 10px;font-size:14px;flex:none;white-space:nowrap}
button.sec.tg.on{background:linear-gradient(var(--cream),var(--gold));color:#000;text-shadow:none}
.recprize{display:none;font-size:20px;color:var(--cream);margin-bottom:8px}
.recx{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:25;width:auto;padding:8px 12px;font-size:14px;opacity:.75}
body.rec .recx{display:block}
body.rec #panel{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
body.rec #panel>.card:not(#stage),body.rec #out{display:none}
body.rec #stage #snd,body.rec #stage #rec,body.rec #stage label.ck{display:none}
body.rec #stage{margin-bottom:0;padding:30px 20px 28px;display:flex;flex-direction:column;gap:20px}
body.rec #stage .btnrow,body.rec .lbl{display:none}
body.rec #stage .now{margin:0}
body.rec #stage #go{margin:0}
body.rec .recprize.has{display:block}
body.rec .name{font-size:clamp(38px,13vw,76px);min-height:120px;margin:0;padding:6px 0;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.pcard{margin-top:12px;padding:10px;border:1.5px solid #3a2f12;border-radius:14px;background:#0a0804}
.ptop{display:flex;gap:10px;align-items:center}
.ptop input{margin:0;text-align:left;flex:1;min-width:0;padding:10px 12px;font-size:17px}
.pth{flex:none;width:58px;height:58px;padding:0;border-radius:12px;overflow:hidden;font-size:22px;letter-spacing:0;line-height:1;display:flex;align-items:center;justify-content:center;background:#000;border:2px solid var(--gold);box-shadow:none;text-shadow:none}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pbot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pbot .qty{display:flex;align-items:center;gap:6px;color:#a99a68;font-size:15px}
.pbot .qty input{width:74px;margin:0;padding:8px;font-size:16px;text-align:center}
.pbot button.sec{padding:8px 10px;font-size:14px;white-space:nowrap}
.drawer{display:grid;grid-template-rows:1fr}
.drawer.anim{transition:grid-template-rows .28s ease}
.drawer.closed{grid-template-rows:0fr}
.dbody{overflow:hidden;min-height:0}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.chev{flex:none;width:10px;height:10px;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(45deg);margin:-4px 6px 0 0;transition:transform .25s,margin .25s}
.dh[aria-expanded="false"] .chev{transform:rotate(135deg);margin:0 6px 0 0}
.dh:active .chev{opacity:.6}
.dt{color:#a99a68;font-size:16px}
.dt b{color:var(--cream)}
.dinner{padding-top:12px}
.ico{width:auto;vertical-align:middle;margin-right:8px;position:relative;top:-1px}
.dt .ico{height:26px}
h2 .ico{height:30px}
button .ico{height:22px;margin-right:6px}
.pimg{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;border:2px solid var(--gold);background:#000}
.pimg.nophoto{display:flex;align-items:center;justify-content:center;font-size:20px;border-style:dashed;opacity:.8}
body.rec .nowc .pimg.nophoto{font-size:30px}
.now{margin-bottom:16px}
.nowlbl{color:#a99a68;font-size:14px;margin-bottom:6px}
.nowbox{padding:8px 12px;border:2px solid var(--gold);border-radius:14px;background:linear-gradient(#000,#14100a);box-shadow:inset 0 4px 8px rgba(0,0,0,.7);text-align:left}
.nowc{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:var(--cream);font-size:20px;line-height:1.2}
.nowc .pname{flex:1;min-width:0;word-break:break-word}
.nowc .pq{flex:none;font-size:16px;color:var(--gold);border:1.5px solid var(--gold);border-radius:99px;padding:0 9px}
.nowc .ph{color:#7d7048;font-size:17px}
.nowlist{margin-top:8px;max-height:240px;overflow-y:auto;border:1.5px solid #3a2f12;border-radius:12px;background:#0a0804;text-align:left}
.nowrow{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;color:var(--cream);font-size:18px;-webkit-tap-highlight-color:transparent}
.nowrow+.nowrow{border-top:1px solid #2a2210}
.nowrow.sel{background:#2b2411}
.nowrow .pname{flex:1;min-width:0;word-break:break-word}
.nowrow .pq{flex:none;font-size:15px;color:var(--gold);border:1.5px solid var(--gold);border-radius:99px;padding:0 8px}
.nowrow .none{color:#a99a68}
body.rec .nowlbl{font-size:16px}
body.rec .nowbox{padding:12px 14px;border-radius:18px}
body.rec .nowc{font-size:clamp(22px,6.2vw,30px);gap:14px}
body.rec .nowc .pimg{width:clamp(64px,18vw,84px);height:clamp(64px,18vw,84px);border-radius:14px}
body.rec .nowc .pq{font-size:22px}
.btnrow{display:flex;gap:6px;flex-wrap:nowrap;justify-content:center;margin-top:16px}
.btnrow button{flex:1 1 auto;min-width:0;padding:9px 6px;font-size:13px;letter-spacing:0}
.btnrow button .ico{height:18px;margin-right:4px}
.tiny{font-size:14px;color:#8a7c4f}
#out{display:block;margin:6px auto 0}
.musbtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:25;width:46px;height:46px;margin:0;padding:0;border-radius:50%;font-size:20px;letter-spacing:0;line-height:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);background:linear-gradient(#2b2411,#050403);color:var(--cream);cursor:pointer;box-shadow:inset 0 1px 0 rgba(247,232,180,.3),0 4px 0 #5a4210,0 8px 12px rgba(0,0,0,.6)}
.musbtn .mi{width:34px;height:34px;object-fit:contain;display:block}
.musbtn .mi.off{display:none}
.musbtn.off .mi.on{display:none}
.musbtn.off .mi.off{display:block}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, doc, query, where, orderBy, serverTimestamp, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let users = [], prizes = [], sel = null, busy = false, unsubs = [], nowId = null;
try { nowId = localStorage.getItem("sorteio_agora") || null; } catch (e) {}

$("in").onclick = async () => {
  $("err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch (e) { $("err").textContent = "E-mail ou senha incorretos."; }
};
$("pw").onkeydown = e => { if (e.key === "Enter") $("in").click(); };
$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  $("login").classList.toggle("hide", !!u);
  $("panel").classList.toggle("hide", !u);
  if (!u) return;
  unsubs.push(onSnapshot(collection(db, "entries"), s => {
    users = s.docs.map(d => d.data().user);
    $("cnt").textContent = users.length;
    if (sel && !users.includes(sel)) closeEd();
    renderChips();
    $("go").disabled = busy || !users.length;
  }, () => { $("err").textContent = "Sem permissão. Confira as regras e o e-mail de admin."; }));
  unsubs.push(onSnapshot(collection(db, "prizes"), s => {
    prizes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
    renderPrizes();
  }));
  unsubs.push(onSnapshot(query(collection(db, "winners"), orderBy("at", "desc")), s => {
    $("hist").innerHTML = "";
    s.docs.forEach(d => { const li = document.createElement("li"); const w = d.data(); li.textContent = w.user + (w.prize ? " — " + w.prize : ""); $("hist").appendChild(li); });
    $("nohist").style.display = s.size ? "none" : "block";
  }));
});

$("go").onclick = () => {
  if (busy || !users.length) return;
  busy = true; $("go").disabled = true; unlockSound();
  const el = $("name"), pool = users.slice(), buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  const win = pool[buf[0] % pool.length]; let i = 0;
  el.classList.remove("win"); $("lbl").textContent = "Sorteando…";
  (function tick() {
    if (i < 28) { el.textContent = pool[Math.floor(Math.random() * pool.length)]; i++; setTimeout(tick, 50 + i * i * 0.3); }
    else {
      el.textContent = win; el.classList.add("win"); $("lbl").textContent = "🎉 Ganhador(a)!"; celebrate();
      addDoc(collection(db, "winners"), { user: win, prize: ((prizes.find(p => p.id === nowId) || {}).name) || "", at: serverTimestamp() });
      if ($("excl").checked) deleteDoc(doc(db, "entries", win));
      busy = false; $("go").disabled = false;
    }
  })();
};

function confetti() {
  const c = $("fx"), x = c.getContext("2d"), cols = ["#e8b13a", "#f7e8b4", "#c9cdd6", "#b9821c", "#fff3c4"], P = [];
  c.width = innerWidth; c.height = innerHeight;
  for (let i = 0; i < 180; i++) P.push({ x: c.width / 2 + (Math.random() - .5) * 90, y: c.height * .38, vx: (Math.random() - .5) * 15, vy: -Math.random() * 14 - 4, w: 6 + Math.random() * 6, h: 10 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4, col: cols[i % cols.length] });
  const t0 = performance.now();
  (function f(t) {
    const dt = t - t0;
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .3; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.col; x.globalAlpha = Math.max(0, 1 - dt / 4200); x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (dt < 4200) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })(t0);
}

async function wipe(name) {
  const s = await getDocs(collection(db, name)), docs = s.docs;
  for (let i = 0; i < docs.length; i += 400) {
    const b = writeBatch(db);
    docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
    await b.commit();
  }
  return docs.length;
}
function twoTap(btn, run, okText) {
  const orig = btn.textContent; let armed = false, t;
  btn.onclick = async () => {
    if (!armed) {
      armed = true; btn.textContent = "Confirmar?";
      t = setTimeout(() => { armed = false; btn.textContent = orig; }, 4000);
      return;
    }
    clearTimeout(t); armed = false; btn.disabled = true; btn.textContent = "Apagando…";
    try { const n = await run(); msg(n ? okText : "Já estava vazio.", false); }
    catch (e) { msg("Erro: " + ((e && (e.code || e.message)) || e), true); }
    btn.disabled = false; btn.textContent = orig;
  };
}

function renderChips() {
  const q = $("q").value.trim().toLowerCase().replace(/^@+/, "");
  const list = q ? users.filter(u => u.includes(q)) : users, box = $("chips");
  box.innerHTML = "";
  list.slice(0, 300).forEach(u => {
    const c = document.createElement("span");
    c.className = "chip" + (u === sel ? " sel" : ""); c.textContent = u;
    c.onclick = () => openEd(u);
    box.appendChild(c);
  });

}
function openEd(u) { sel = u; $("ed").classList.remove("hide"); $("edIn").value = u; renderChips(); }

$("edSave").onclick = async () => {
  if (!sel) return;
  const v = $("edIn").value.trim().replace(/^@+/, "").toLowerCase(), nu = "@" + v;
  if (!/^[a-z0-9._]{2,30}$/.test(v)) return msg("@ inválido (letras, números, ponto e _).", true);

const errMsg = e => "Erro: " + ((e && (e.code || e.message)) || e);
function fileToPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 400, c = document.createElement("canvas"); c.width = c.height = S;
      const x = c.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0, 0, S, S);
      const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      x.drawImage(img, sx, sy, m, m, 0, 0, S, S); URL.revokeObjectURL(url);
      let q = .82, d = c.toDataURL("image/jpeg", q);
      while (d.length > 150000 && q > .4) { q -= .1; d = c.toDataURL("image/jpeg", q); }
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagem inválida")); };
    img.src = url;
  });
}

      try { await updateDoc(doc(db, "prizes", p.id), { name: v }); } catch (e) { msg(errMsg(e), true); }
    };
    top.appendChild(th); top.appendChild(inp);
    const bot = document.createElement("div"); bot.className = "pbot";
    const ql = document.createElement("label"); ql.className = "qty"; ql.appendChild(document.createTextNode("Qtd"));
    const qi = document.createElement("input"); qi.type = "number"; qi.min = 1; qi.max = 9999; qi.inputMode = "numeric"; qi.value = p.qty || 1;
    qi.onchange = async () => {
      const v = clampQty(qi.value); qi.value = v;
      try { await updateDoc(doc(db, "prizes", p.id), { qty: v }); } catch (e) { msg(errMsg(e), true); }
    };
    ql.appendChild(qi); bot.appendChild(ql);
    const tg = document.createElement("button"); tg.className = "sec tg" + (p.visible ? " on" : ""); tg.textContent = p.visible ? "👁 Visível" : "Oculto";
    tg.onclick = async () => { try { await updateDoc(doc(db, "prizes", p.id), { visible: !p.visible }); } catch (e) { msg(errMsg(e), true); } };
    bot.appendChild(tg);
    if (p.photo) {
      const rm = document.createElement("button"); rm.className = "sec"; rm.textContent = "Tirar foto";
      rm.onclick = async () => { try { await updateDoc(doc(db, "prizes", p.id), { photo: "" }); } catch (e) { msg(errMsg(e), true); } };
      bot.appendChild(rm);
    }
    const del = document.createElement("button"); del.className = "sec"; del.textContent = "Excluir";
    twoTap(del, async () => { await deleteDoc(doc(db, "prizes", p.id)); return 1; }, "Prêmio excluído.");
    bot.appendChild(del);
    card.appendChild(top); card.appendChild(bot); box.appendChild(card);
  });
  renderNow();
}
/* ---------- prêmio sorteando agora ---------- */
function fillPrize(el, p) {
  if (p.photo) { const im = document.createElement("img"); im.className = "pimg"; im.alt = ""; im.src = p.photo; el.appendChild(im); }
  else { const ph = document.createElement("div"); ph.className = "pimg nophoto"; ph.textContent = "🖼️"; el.appendChild(ph); }
  const t = document.createElement("div"); t.className = "pname"; t.textContent = p.name || ""; el.appendChild(t);
  if ((p.qty || 1) > 1) { const q = document.createElement("div"); q.className = "pq"; q.textContent = "×" + p.qty; el.appendChild(q); }
}
function saveNow() { try { if (nowId) localStorage.setItem("sorteio_agora", nowId); else localStorage.removeItem("sorteio_agora"); } catch (e) {} }
function closeNow() { $("nowlist").classList.add("hide"); $("nowbox").setAttribute("aria-expanded", "false"); }
function renderNow() {
  let cur = prizes.find(p => p.id === nowId);
  if (nowId && !cur) { nowId = null; saveNow(); }
  const c = $("nowc"); c.innerHTML = "";
  if (cur) fillPrize(c, cur); else { const ph = document.createElement("span"); ph.className = "ph"; ph.textContent = prizes.length ? "Toque para escolher o prêmio" : "Cadastre um prêmio no painel"; c.appendChild(ph); }
  const box = $("nowlist"); box.innerHTML = "";
  const none = document.createElement("div"); none.className = "nowrow" + (cur ? "" : " sel");
  none.innerHTML = '<div class="pname none">Nenhum (sem prêmio na tela)</div>';
  none.onclick = () => { nowId = null; saveNow(); renderNow(); closeNow(); };
  box.appendChild(none);
  prizes.forEach(p => {
    const row = document.createElement("div"); row.className = "nowrow" + (p.id === nowId ? " sel" : "");
    fillPrize(row, p);
    row.onclick = () => { nowId = p.id; saveNow(); renderNow(); closeNow(); };
    box.appendChild(row);
  });
}
function toggleNow() {
  const open = $("nowlist").classList.contains("hide");
  $("nowlist").classList.toggle("hide", !open); $("nowbox").setAttribute("aria-expanded", open ? "true" : "false");
}
$("nowbox").onclick = toggleNow;
$("nowbox").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleNow(); } };
async function addPrize() {
  const n = $("pn").value.trim(); if (!n) return msg("Escreva o nome do prêmio.", true);
  try {
    await addDoc(collection(db, "prizes"), { name: n, qty: clampQty($("pq").value), photo: newPhoto, visible: false, order: Date.now() });
    $("pn").value = ""; $("pq").value = 1; newPhoto = ""; $("pph").textContent = "📷 Foto"; $("pphn").textContent = "Quantidade e foto são opcionais.";
    msg("Prêmio adicionado. Toque em “Oculto” para mostrar no site.");
  } catch (e) { msg(errMsg(e), true); }
}
$("pa").onclick = addPrize;
$("pn").onkeydown = e => { if (e.key === "Enter") addPrize(); };

/* ---------- modo gravação ---------- */
$("rec").onclick = () => { document.body.classList.add("rec"); window.scrollTo(0, 0); };
$("recx").onclick = () => document.body.classList.remove("rec");

</script>
<script>
(function () {
  var VOL = 0.4, DUCK = 0.08;
  var a = new Audio("musica.mp3"); a.loop = true; a.volume = VOL; a.preload = "auto";
  var on = true, wasPlaying = false, fi, b = document.getElementById("mus");
  try { on = localStorage.getItem("sorteio_musica") !== "off"; } catch (e) {}
  function paint() { b.classList.toggle("off", !on); b.setAttribute("aria-label", on ? "Desligar música" : "Ligar música"); }
  function start() { if (on) a.play().catch(function () {}); }
  paint();
  var evs = ["pointerdown", "keydown", "touchend"];
  function h() { if (!on) return; a.play().then(function () { evs.forEach(function (e) { document.removeEventListener(e, h, true); }); }).catch(function () {}); }
  evs.forEach(function (e) { document.addEventListener(e, h, true); });
  b.onclick = function () {
    on = !on;
    try { localStorage.setItem("sorteio_musica", on ? "on" : "off"); } catch (e) {}
    paint();
    if (on) { a.volume = VOL; start(); } else a.pause();
  };
  function fade(to, ms) {
    clearInterval(fi);
    var from = a.volume, t0 = Date.now();
    fi = setInterval(function () {
      var k = Math.min(1, (Date.now() - t0) / ms);
      a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k >= 1) clearInterval(fi);
    }, 40);
  }
  window.duckMusic = function () {
    if (a.paused) return;
    fade(DUCK, 250);
    setTimeout(function () { fade(VOL, 2200); }, 2400);
  };
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { wasPlaying = !a.paused; a.pause(); }
    else if (on && wasPlaying) a.play().catch(function () {});
  });
})();
</script>
<script>
(function () {
  document.querySelectorAll(".dh[data-d]").forEach(function (h) {
    var id = h.getAttribute("data-d"), k = "sorteio_d_" + id, d = document.getElementById("d-" + id), open = true;
    if (!d) return;
    try { if (localStorage.getItem(k) === "0") open = false; } catch (e) {}
    function paint() { d.classList.toggle("closed", !open); h.setAttribute("aria-expanded", open ? "true" : "false"); }
    function tog() { open = !open; try { localStorage.setItem(k, open ? "1" : "0"); } catch (e) {} paint(); }
    paint();
    setTimeout(function () { d.classList.add("anim"); }, 80);
    h.addEventListener("click", tog);
    h.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
  });
})();
</script>
