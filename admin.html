<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel do sorteio</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1c1b22;--mut:#6b6a78;--bd:#e3e1ee;--ac:#7c3aed;--ac2:#f59e0b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121118;--card:#1c1b26;--tx:#f1f0f7;--mut:#9b9aab;--bd:#2d2b3b;--ac:#a78bfa;--ac2:#fbbf24;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 10px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.45}
.stage{text-align:center;padding:22px 10px}
.name{font-size:clamp(26px,8vw,38px);font-weight:800;word-break:break-all;min-height:48px;color:var(--ac)}
.name.win{color:var(--ac2);animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.big{width:100%;font-size:18px;padding:15px;margin-top:10px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow-y:auto}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:4px 11px;font-size:14px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px;margin-top:10px}
label.ck input{width:auto;margin:0}
ol{margin:0;padding-left:20px}.tiny{font-size:12px;color:var(--mut)}#err{color:#dc2626;font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>🎁 Painel do sorteio</h1>

<div class="card" id="login">
  <h2>Entrar</h2>
  <input id="em" type="email" placeholder="Seu e-mail de admin" autocomplete="username">
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
  <button id="in" style="width:100%">Entrar</button>
  <div id="err"></div>
</div>

<div id="panel" class="hide">
  <div class="card stage">
    <div class="tiny" id="lbl">Sorteado</div>
    <div class="name" id="name">@???</div>
    <button class="big" id="go" style="width:100%">Sortear agora</button>
    <label class="ck"><input type="checkbox" id="excl" checked> Tirar o sorteado da lista depois</label>
  </div>
  <div class="card">
    <div class="meta"><span><b id="cnt">0</b> participantes (ao vivo)</span><button class="sec" id="clear" style="padding:6px 10px">Limpar tudo</button></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="card">
    <h2>Ganhadores</h2>
    <ol id="hist"></ol>
    <div class="tiny" id="nohist">Nenhum sorteio ainda.</div>
  </div>
  <button class="sec" id="out" style="width:100%">Sair</button>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, query, orderBy, serverTimestamp, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let users = [], busy = false, unsubs = [];

$("in").onclick = async () => {
  $("err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch (e) { $("err").textContent = "E-mail ou senha incorretos."; }
};
$("pw").onkeydown = e => { if (e.key === "Enter") $("in").click(); };
$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  $("login").classList.toggle("hide", !!u);
  $("panel").classList.toggle("hide", !u);
  if (!u) return;
  unsubs.push(onSnapshot(collection(db, "entries"), s => {
    users = s.docs.map(d => d.data().user);
    $("cnt").textContent = users.length;
    $("chips").innerHTML = "";
    users.forEach(x => { const c = document.createElement("span"); c.className = "chip"; c.textContent = x; $("chips").appendChild(c); });
    $("go").disabled = busy || !users.length;
  }, () => { $("err").textContent = "Sem permissão. Confira as regras e o e-mail de admin."; }));
  unsubs.push(onSnapshot(query(collection(db, "winners"), orderBy("at", "desc")), s => {
    $("hist").innerHTML = "";
    s.docs.forEach(d => { const li = document.createElement("li"); li.textContent = d.data().user; $("hist").appendChild(li); });
    $("nohist").style.display = s.size ? "none" : "block";
  }));
});

$("go").onclick = () => {
  if (busy || !users.length) return;
  busy = true; $("go").disabled = true;
  const el = $("name"), pool = users.slice(), buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  const win = pool[buf[0] % pool.length]; let i = 0;
  el.classList.remove("win"); $("lbl").textContent = "Sorteando…";
  (function tick() {
    if (i < 28) { el.textContent = pool[Math.floor(Math.random() * pool.length)]; i++; setTimeout(tick, 50 + i * i * 0.3); }
    else {
      el.textContent = win; el.classList.add("win"); $("lbl").textContent = "🎉 Ganhador(a)!";
      addDoc(collection(db, "winners"), { user: win, at: serverTimestamp() });
      if ($("excl").checked) deleteDoc(doc(db, "entries", win));
      busy = false; $("go").disabled = false;
    }
  })();
};

$("clear").onclick = async () => {
  if (!users.length || !confirm("Apagar TODOS os participantes?")) return;
  const s = await getDocs(collection(db, "entries")), b = writeBatch(db);
  s.docs.forEach(d => b.delete(d.ref)); await b.commit();
};
</script>
</body>
</html>
