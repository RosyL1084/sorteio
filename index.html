<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Participe do sorteio!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--disp:"Lilita One",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--gold:#e8b13a;--cream:#f7e8b4;--blk:#000;--ok:#9dff9d;--er:#ff8b7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;color:var(--cream);
font:16px/1.4 "Lilita One",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(ellipse 60% 38% at 12% 8%,rgba(176,184,196,.34),transparent 70%),radial-gradient(ellipse 55% 34% at 92% 30%,rgba(140,148,160,.24),transparent 70%),radial-gradient(ellipse 65% 40% at 20% 95%,rgba(150,158,170,.26),transparent 70%),radial-gradient(ellipse 50% 30% at 85% 92%,rgba(196,202,212,.30),transparent 70%),#030303;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;opacity:.06;background:repeating-linear-gradient(45deg,var(--gold) 0 2px,transparent 2px 22px);pointer-events:none}
.card{position:relative;margin-top:58px;width:100%;max-width:420px;text-align:center;padding:74px 20px 22px;background:linear-gradient(#2b2411 0%,#12100a 30%,#050403 100%);border:3px solid var(--gold);border-radius:22px;box-shadow:inset 0 1px 0 rgba(247,232,180,.35),0 9px 0 #5a4210,0 20px 30px rgba(0,0,0,.7)}
.avatar{position:absolute;top:-58px;left:50%;transform:translateX(-50%);width:116px;height:116px;border-radius:50%;object-fit:cover;background:#000;border:3px solid var(--gold);box-shadow:inset 0 1px 0 rgba(247,232,180,.35),0 5px 0 #5a4210,0 10px 16px rgba(0,0,0,.65)}
.prize{display:none;margin:6px 0 16px;padding:12px 14px;border:2px solid var(--gold);border-radius:14px;background:linear-gradient(#000,#14100a);box-shadow:inset 0 4px 8px rgba(0,0,0,.7)}
.drawer{display:grid;grid-template-rows:1fr}
.drawer.anim{transition:grid-template-rows .28s ease}
.drawer.closed{grid-template-rows:0fr}
.dbody{overflow:hidden;min-height:0}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.chev{flex:none;width:10px;height:10px;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(45deg);margin:-4px 6px 0 0;transition:transform .25s,margin .25s}
.dh[aria-expanded="false"] .chev{transform:rotate(135deg);margin:0 6px 0 0}
.dh:active .chev{opacity:.6}
.ico{height:28px;width:auto;vertical-align:middle;margin-right:8px;position:relative;top:-1px}
.plabel{flex:1;text-align:center;font-size:14px;letter-spacing:.16em;color:#a99a68;padding-left:16px}
.dinner{padding-top:8px}
.pitem{display:flex;align-items:center;gap:12px;text-align:left;padding:7px 0}
.pitem+.pitem{border-top:1px solid #3a2f12}
.pimg{flex:none;width:58px;height:58px;border-radius:12px;object-fit:cover;border:2px solid var(--gold);background:#000}
.pname{flex:1;min-width:0;font-size:21px;line-height:1.2;color:var(--cream);word-break:break-word}
.pq{flex:none;font-size:18px;color:var(--gold);border:1.5px solid var(--gold);border-radius:99px;padding:1px 11px}
.badge{font-family:var(--disp);display:inline-block;background:linear-gradient(#2a2210,#000);box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(247,232,180,.3);color:var(--cream);border:2px solid var(--gold);border-radius:12px;padding:2px 14px;font-size:14px;letter-spacing:.06em;transform:rotate(-3deg);margin-bottom:10px}
h1{margin:6px 0 4px;font-family:var(--disp);font-size:clamp(30px,9vw,40px);font-weight:400;letter-spacing:.01em;line-height:1.05;color:var(--cream);text-shadow:0 2px 0 #7a5a14,0 5px 0 var(--blk),0 10px 18px rgba(0,0,0,.6)}
p{margin:0 0 16px;color:#a99a68;font-size:17px}
input{width:100%;padding:14px;border-radius:14px;border:2px solid var(--gold);background:linear-gradient(#000,#14100a);color:var(--cream);font:inherit;font-size:20px;text-align:center;box-shadow:inset 0 4px 8px rgba(0,0,0,.85),0 1px 0 rgba(247,232,180,.18)}
input::placeholder{color:#7d7048}
input:focus{outline:2px solid var(--cream);outline-offset:2px}
button{width:100%;margin-top:12px;padding:14px;border:2px solid var(--gold);border-radius:14px;background:linear-gradient(#2b2411 0%,#12100a 48%,#050403 100%);color:var(--cream);font-family:var(--disp);font-size:24px;letter-spacing:.05em;cursor:pointer;text-shadow:0 2px 0 #000;box-shadow:inset 0 1px 0 rgba(247,232,180,.35),0 5px 0 #5a4210,0 10px 14px rgba(0,0,0,.6);transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(247,232,180,.35),0 1px 0 #5a4210,0 3px 6px rgba(0,0,0,.6)}
button:disabled{opacity:.5}
#msg{min-height:26px;margin-top:14px;font-family:var(--disp);font-size:18px}
.ok{color:var(--ok)}.er{color:var(--er)}
small{display:block;margin-top:14px;color:#6f6440;font:12px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.musbtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:25;width:46px;height:46px;margin:0;padding:0;border-radius:50%;font-size:20px;letter-spacing:0;line-height:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);background:linear-gradient(#2b2411,#050403);color:var(--cream);cursor:pointer;box-shadow:inset 0 1px 0 rgba(247,232,180,.3),0 4px 0 #5a4210,0 8px 12px rgba(0,0,0,.6)}
.musbtn .mi{width:34px;height:34px;object-fit:contain;display:block}
.musbtn .mi.off{display:none}
.musbtn.off .mi.on{display:none}
.musbtn.off .mi.off{display:block}
</style>
</head>

  <p>Digite seu @ do TikTok para entrar.</p>
  <input id="u" placeholder="@seuusuario" autocapitalize="none" autocorrect="off" maxlength="40">
  <button id="b">PARTICIPAR</button>
  <div id="msg"></div>
  <small>Este sorteio não é patrocinado, apoiado ou administrado pelo TikTok.</small>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const say = (t, c) => { $("msg").textContent = t; $("msg").className = c; };
async function enviar() {
  let v = $("u").value.trim().replace(/^@+/, "").toLowerCase();
  if (!/^[a-z0-9._]{2,30}$/.test(v)) return say("Digite um @ válido (letras, números, ponto e _).", "er");
  const user = "@" + v;
  $("b").disabled = true;
  try {
    await setDoc(doc(db, "entries", user), { user, createdAt: serverTimestamp() });
    say("Você está participando! Boa sorte 🍀", "ok");
    $("u").value = "";
  } catch (e) {
    say("Esse @ já está participando (ou houve um erro). Tente de novo mais tarde.", "er");
  }
  $("b").disabled = false;
}
(async () => {
  try {
    const s = await getDocs(query(collection(db, "prizes"), where("visible", "==", true)));
    const items = s.docs.map(d => d.data()).filter(x => x.name).sort((a, b) => (a.order || 0) - (b.order || 0));
    if (!items.length) return;
    items.forEach(x => {
      const d = document.createElement("div"); d.className = "pitem";
      if (x.photo) { const im = document.createElement("img"); im.className = "pimg"; im.alt = ""; im.src = x.photo; d.appendChild(im); }
      const t = document.createElement("div"); t.className = "pname"; t.textContent = x.name; d.appendChild(t);
      if ((x.qty || 1) > 1) { const q = document.createElement("div"); q.className = "pq"; q.textContent = "×" + x.qty; d.appendChild(q); }
      $("plist").appendChild(d);
    });
    $("prize").style.display = "block";
  } catch (e) {}
})();
$("b").onclick = enviar;
$("u").onkeydown = e => { if (e.key === "Enter") enviar(); };
</script>

(function () {
  var VOL = 0.4, DUCK = 0.08;
  var a = new Audio("musica.mp3"); a.loop = true; a.volume = VOL; a.preload = "auto";
  var on = true, wasPlaying = false, fi, b = document.getElementById("mus");
  try { on = localStorage.getItem("sorteio_musica") !== "off"; } catch (e) {}
  function paint() { b.classList.toggle("off", !on); b.setAttribute("aria-label", on ? "Desligar música" : "Ligar música"); }
  function start() { if (on) a.play().catch(function () {}); }
  paint();
  var evs = ["pointerdown", "keydown", "touchend"];
  function h() { if (!on) return; a.play().then(function () { evs.forEach(function (e) { document.removeEventListener(e, h, true); }); }).catch(function () {}); }
  evs.forEach(function (e) { document.addEventListener(e, h, true); });
  b.onclick = function () {
    on = !on;
    try { localStorage.setItem("sorteio_musica", on ? "on" : "off"); } catch (e) {}
    paint();
    if (on) { a.volume = VOL; start(); } else a.pause();
  };
  function fade(to, ms) {
    clearInterval(fi);
    var from = a.volume, t0 = Date.now();
    fi = setInterval(function () {
      var k = Math.min(1, (Date.now() - t0) / ms);
      a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k >= 1) clearInterval(fi);
    }, 40);
  }
  window.duckMusic = function () {
    if (a.paused) return;
    fade(DUCK, 250);
    setTimeout(function () { fade(VOL, 2200); }, 2400);
  };
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { wasPlaying = !a.paused; a.pause(); }
    else if (on && wasPlaying) a.play().catch(function () {});
  });
})();
</script>
<script>
(function () {
  document.querySelectorAll(".dh[data-d]").forEach(function (h) {
    var id = h.getAttribute("data-d"), k = "sorteio_d_" + id, d = document.getElementById("d-" + id), open = true;
    if (!d) return;
    try { if (localStorage.getItem(k) === "0") open = false; } catch (e) {}
    function paint() { d.classList.toggle("closed", !open); h.setAttribute("aria-expanded", open ? "true" : "false"); }
    function tog() { open = !open; try { localStorage.setItem(k, open ? "1" : "0"); } catch (e) {} paint(); }
    paint();
    setTimeout(function () { d.classList.add("anim"); }, 80);
    h.addEventListener("click", tog);
    h.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
  });
})();
</script>
