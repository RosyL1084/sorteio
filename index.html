<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Participe do sorteio</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1c1b22;--mut:#6b6a78;--bd:#e3e1ee;--ac:#7c3aed;--ok:#16a34a;--er:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121118;--card:#1c1b26;--tx:#f1f0f7;--mut:#9b9aab;--bd:#2d2b3b;--ac:#a78bfa;--ok:#4ade80;--er:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;text-align:center}
h1{font-size:24px;margin:0 0 6px}
p{color:var(--mut);margin:0 0 16px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;text-align:center}
button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
#msg{min-height:24px;margin-top:12px;font-weight:600}
.ok{color:var(--ok)}.er{color:var(--er)}
small{display:block;margin-top:14px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="card">
  <h1>🎁 Participe do sorteio!</h1>
  <p>Digite seu @ do TikTok para entrar.</p>
  <input id="u" placeholder="@seuusuario" autocapitalize="none" autocorrect="off" maxlength="40">
  <button id="b">Participar</button>
  <div id="msg"></div>
  <small>Este sorteio não é patrocinado, apoiado ou administrado pelo TikTok.</small>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const say = (t, c) => { $("msg").textContent = t; $("msg").className = c; };
async function enviar() {
  let v = $("u").value.trim().replace(/^@+/, "").toLowerCase();
  if (!/^[a-z0-9._]{2,30}$/.test(v)) return say("Digite um @ válido (letras, números, ponto e _).", "er");
  const user = "@" + v;
  $("b").disabled = true;
  try {
    await setDoc(doc(db, "entries", user), { user, createdAt: serverTimestamp() });
    say("Você está participando! Boa sorte 🍀", "ok");
    $("u").value = "";
  } catch (e) {
    say("Esse @ já está participando (ou houve um erro). Tente de novo mais tarde.", "er");
  }
  $("b").disabled = false;
}
$("b").onclick = enviar;
$("u").onkeydown = e => { if (e.key === "Enter") enviar(); };
</script>
</body>
</html>
